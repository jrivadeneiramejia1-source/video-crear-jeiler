<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#sub{position:fixed;left:0;right:0;bottom:6%;text-align:center;font:700 clamp(18px,3.4vw,44px)/1.25 Inter,"DejaVu Sans",sans-serif;color:#fff;padding:0 6%;text-shadow:0 2px 6px #000,0 0 14px #000}
</style></head><body><div id="sub"></div>
<script src="/gsap/gsap.min.js"></script>
<script type="module">
import * as THREE from '/three/build/three.module.js';
const P = window.PROYECTO, W = P.ancho, H = P.alto, N = (P.camara||{});
const rd = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
rd.setSize(W,H); rd.setPixelRatio(1); rd.shadowMap.enabled=true; document.body.prepend(rd.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(P.fondo||'#101820');
if (P.niebla) sc.fog = new THREE.Fog(P.fondo||'#101820', P.niebla[0], P.niebla[1]);
const fov0 = N.fov||50, hf = 2*Math.atan(Math.tan(fov0*Math.PI/360)*16/9);   // ancho de visión de una escena horizontal 16:9
const cam = new THREE.PerspectiveCamera(W>=H ? fov0 : 2*Math.atan(Math.tan(hf/2)*H/W)*180/Math.PI, W/H, 0.1, 500);   // en vertical se conserva ese ancho
const L = P.luces||{}; sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, L.ambiente??0.6));
const sol = new THREE.DirectionalLight(0xffffff, (L.sol&&L.sol.fuerza)??2.2); sol.position.set(...((L.sol&&L.sol.pos)||[5,8,4]));
sol.castShadow=true; sol.shadow.mapSize.set(1024,1024); Object.assign(sol.shadow.camera,{left:-12,right:12,top:12,bottom:-12}); sc.add(sol);
if (P.suelo){ const s=new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:P.suelo.color||'#1c2733',roughness:.9})); s.rotation.x=-Math.PI/2; s.receiveShadow=true; sc.add(s); }
const G = {caja:()=>new THREE.BoxGeometry(1,1,1), esfera:()=>new THREE.SphereGeometry(.5,32,20), cilindro:()=>new THREE.CylinderGeometry(.5,.5,1,32), cono:()=>new THREE.ConeGeometry(.5,1,32), toro:()=>new THREE.TorusGeometry(.4,.15,16,48), plano:()=>new THREE.PlaneGeometry(1,1)};
const obj = {}, tl = gsap.timeline({paused:true}), fin = {};
for (const o of (P.objetos||[])){
  const g = (G[o.forma]||G.caja)(), m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:o.color||'#cccccc',roughness:o.rugoso??.55,metalness:o.metal??0}));
  m.castShadow=true; m.receiveShadow=true; m.position.set(...(o.pos||[0,0,0])); m.rotation.set(...(o.rot||[0,0,0])); m.scale.set(...(o.tam||[1,1,1])); sc.add(m); obj[o.id||('o'+Object.keys(obj).length)]=m;
  const id=o.id||('o'+(Object.keys(obj).length-1)); const cur={pos:[...m.position.toArray()],rot:[m.rotation.x,m.rotation.y,m.rotation.z],esc:[...m.scale.toArray()]};
  for (const a of (o.anim||[]).slice().sort((x,y)=>x.a-y.a)){
    const tgt={pos:m.position,rot:m.rotation,esc:m.scale}[a.prop], k=a.prop==='rot'?['x','y','z']:['x','y','z'], d=cur[a.prop], h=a.hasta;
    tl.fromTo(tgt,{x:d[0],y:d[1],z:d[2]},{x:h[0],y:h[1],z:h[2],duration:a.b-a.a,ease:a.ease||'power1.inOut',immediateRender:false},a.a); cur[a.prop]=[...h];
  }
}
const px={x:0,y:0,z:0,lx:0,ly:0,lz:0}, c0=N.pos||[0,2,8], l0=N.mira||[0,1,0]; Object.assign(px,{x:c0[0],y:c0[1],z:c0[2],lx:l0[0],ly:l0[1],lz:l0[2]});
let cp=[...c0], cl=[...l0];
for (const v of (N.mov||[]).slice().sort((x,y)=>x.a-y.a)){ const p=v.pos||cp, l=v.mira||cl;
  tl.fromTo(px,{x:cp[0],y:cp[1],z:cp[2],lx:cl[0],ly:cl[1],lz:cl[2]},{x:p[0],y:p[1],z:p[2],lx:l[0],ly:l[1],lz:l[2],duration:v.b-v.a,ease:v.ease||'power1.inOut',immediateRender:false},v.a); cp=[...p]; cl=[...l]; }
window.TOTAL = P.duracion; const sub=document.getElementById('sub');
window.render = t => { tl.time(Math.min(Math.max(t,0),P.duracion),false); cam.position.set(px.x,px.y,px.z); cam.lookAt(px.lx,px.ly,px.lz);
  const c=(P.cues||[]).find(c=>t>=c.a&&t<c.b); sub.textContent=c?(c.texto||''):''; rd.render(sc,cam); };
window.render(0); window.READY = true;
</script></body></html>
